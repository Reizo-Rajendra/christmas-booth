<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Gallery — Database Foto Pengunjung Reizo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      background: #120507;
      color: #fff9ed;
      padding: 40px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .admin-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    .admin-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: #ffd700;
      margin-bottom: 8px;
    }
    .admin-subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
    }
    .admin-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .admin-stats {
      font-size: 1.1rem;
      color: #f3d068;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1 class="admin-title">Database Foto Masuk (Admin Reizo)</h1>
      <p class="admin-subtitle">Semua orang yang berfoto di website kamu tersimpan di sini secara aman.</p>
    </div>

    <div class="admin-actions">
      <div class="admin-stats" id="adminStats">Memuat total foto...</div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-holiday-gold" id="btnAdminRefresh" style="padding: 8px 18px; border-radius: 20px;">
          🔄 Refresh Data
        </button>
        <a href="/" class="btn-holiday-outline" style="padding: 8px 18px; border-radius: 20px; text-decoration: none; display: inline-flex; align-items: center;">
          ← Kembali ke Website
        </a>
      </div>
    </div>

    <div id="adminGalleryGrid" class="community-gallery-grid">
      <!-- Loaded dynamically from /api/submissions -->
    </div>
  </div>

  <script>
    const grid = document.getElementById('adminGalleryGrid');
    const stats = document.getElementById('adminStats');
    const btnRefresh = document.getElementById('btnAdminRefresh');

    async function loadAdminGallery() {
      try {
        const res = await fetch('/api/submissions');
        const json = await res.json();

        if (!json.success || !json.data || json.data.length === 0) {
          stats.innerText = 'Total Foto Masuk: 0';
          grid.innerHTML = '<div class="gallery-empty-state"><p>Belum ada foto tersimpan di database.</p></div>';
          return;
        }

        stats.innerText = `Total Foto Masuk: ${json.data.length} foto`;

        grid.innerHTML = json.data.map(item => {
          const d = new Date(item.createdAt).toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          return `
            <div class="gallery-card" data-id="${item.id}" style="background: #251215; border-color: rgba(212,175,55,0.4);">
              <div class="gallery-card-img-wrap" onclick="window.open('${item.imageUrl}', '_blank')">
                <img src="${item.imageUrl}" class="gallery-card-img" alt="${item.name}">
              </div>
              <div class="gallery-card-meta">
                <span class="gallery-card-title" style="color: #ffd700;">${item.name || 'Pengunjung'}</span>
                <span class="gallery-card-date" style="color: rgba(255,255,255,0.6);">${d}</span>
              </div>
              <div class="gallery-card-actions">
                <a href="${item.imageUrl}" download="Photostrip-${item.id}.png" class="gallery-btn-download" style="background: #ffd700; color: #120507; border: none;">
                  ⬇️ Download
                </a>
                <button class="gallery-btn-delete" data-id="${item.id}" title="Hapus foto" style="color: #ff6b6b; font-size: 1.1rem;">
                  🗑️
                </button>
              </div>
            </div>
          `;
        }).join('');

        grid.querySelectorAll('.gallery-btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            if (confirm('Hapus foto ini dari database?')) {
              await fetch('/api/submissions/' + id, { method: 'DELETE' });
              loadAdminGallery();
            }
          });
        });
      } catch (err) {
        console.warn('Error loading admin gallery', err);
      }
    }

    if (btnRefresh) btnRefresh.addEventListener('click', loadAdminGallery);
    loadAdminGallery();
  </script>
</body>
</html>
